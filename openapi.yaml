openapi: 3.1.0
info:
  title: CausalLayer MCP — FaultKey
  version: 0.2.0
  summary: Deterministic AI-liability attribution over Model Context Protocol.
  description: |
    Issues signed, Bitcoin-anchored CausalCertificateV1 receipts that compute a
    vendor / deployer / user liability split for an AI incident. Designed for
    AI-insurance underwriting, APRA CPS 230, EU AI Act Article 12 logging,
    ISO/IEC 42001, and the NIST AI Risk Management Framework.
  contact:
    name: FaultKey
    url: https://faultkey.pages.dev
    email: hello@faultkey.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://causallayer-mcp-demo.zykm9qkk7j.workers.dev
    description: Public demo (anonymous, free, rate-limited)
paths:
  /healthz:
    get:
      summary: Liveness probe + tool manifest.
      operationId: healthz
      responses:
        "200":
          description: Service is healthy. Returns the tool manifest.
          content:
            application/json:
              schema: { type: object }
  /stats:
    get:
      summary: Public, anonymized demand-signal stats.
      operationId: stats
      responses:
        "200": { description: Aggregated counters. }
  /mcp:
    post:
      summary: MCP JSON-RPC endpoint (Streamable HTTP transport).
      operationId: mcp
      description: |
        Standard MCP transport. Send `initialize`, capture the
        `mcp-session-id` response header, send `notifications/initialized`,
        then issue `tools/list` and `tools/call` JSON-RPC messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, const: "2.0" }
                id:      { oneOf: [{ type: integer }, { type: string }] }
                method:  { type: string }
                params:  { type: object }
      responses:
        "200":
          description: JSON-RPC response (or SSE stream when negotiated).
        "401":
          description: Bearer required when BILLING_MODE=stripe.
tags:
  - name: tools
    description: |
      submit_incident, verify_certificate, get_anchor_status, query_issuer_registry
externalDocs:
  description: Source code on GitHub
  url: https://github.com/smq9sn5jck-coder/causallayer-mcp
