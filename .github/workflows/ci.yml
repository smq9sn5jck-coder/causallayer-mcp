name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Worker deps
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:coverage

  build:
    name: Build & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Worker deps
        run: npm install --no-audit --no-fund || true

      - name: Install CLI deps
        working-directory: ./cli
        run: npm install --no-audit --no-fund

      - name: Validate JSON / YAML manifests
        run: |
          set -e
          for f in server.json mcp.json package.json cli/package.json; do
            [ -f "$f" ] && node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "  ok: $f"
          done
          for f in smithery.yaml openapi.yaml .github/dependabot.yml; do
            [ -f "$f" ] && python3 -c "import yaml; yaml.safe_load(open('$f'))" && echo "  ok: $f"
          done

      - name: Verify CLI shim is executable
        run: |
          set -e
          chmod +x cli/bin/causallayer-mcp.mjs
          head -1 cli/bin/causallayer-mcp.mjs | grep -q '^#!/usr/bin/env node' && echo "  ok: CLI shebang"

  integration:
    name: Live MCP integration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Probe live MCP endpoint (initialize)
        run: |
          set -e
          for url in https://mcp.faultkey.com/mcp https://causallayer-mcp-demo.zykm9qkk7j.workers.dev/mcp; do
            echo "Probing $url ..."
            RESP=$(curl -sS -X POST "$url" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              --max-time 10 \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
            echo "$RESP" | head -c 400
            echo ""
            echo "$RESP" | grep -q '"causallayer-mcp"' && echo "  ✓ initialize OK on $url"
          done

      - name: Probe tools/list
        run: |
          set -e
          MCP_URL="https://causallayer-mcp-demo.zykm9qkk7j.workers.dev/mcp"
          # Step 1: Initialize and capture session ID
          SESSION_ID=$(curl -sS -D- -X POST "$MCP_URL" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --max-time 10 \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci-test","version":"1.0"}}}' \
            -o /dev/null 2>/dev/null | grep -i "^mcp-session-id:" | sed 's/[Mm]cp-[Ss]ession-[Ii]d: //;s/\r//')
          echo "Session: $SESSION_ID"
          # Step 2: tools/list with session
          RESP=$(curl -sS -X POST "$MCP_URL" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -H "Mcp-Session-Id: $SESSION_ID" \
            --max-time 10 \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')
          echo "$RESP" | head -c 600
          echo ""
          echo "$RESP" | grep -q "submit_incident" && echo "  ✓ submit_incident exposed"
          echo "$RESP" | grep -q "verify_certificate" && echo "  ✓ verify_certificate exposed"
          echo "$RESP" | grep -q "get_anchor_status" && echo "  ✓ get_anchor_status exposed"
          echo "$RESP" | grep -q "query_issuer_registry" && echo "  ✓ query_issuer_registry exposed"

  docker:
    name: Docker build (Glama-compatible stdio image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: causallayer-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
